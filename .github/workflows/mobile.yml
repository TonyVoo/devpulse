name: mobile

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile.yml"

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib \
            || (echo "::error::generated code is stale — run build_runner and commit" && exit 1)
      - name: Format
        # Generated code (*.g.dart) is checked by the build_runner step above, not formatted.
        run: find lib test integration_test -name '*.dart' ! -name '*.g.dart' -print0 | xargs -0 dart format --output=none --set-exit-if-changed
      - run: flutter analyze
      - run: flutter test

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - run: flutter build apk --debug --dart-define=API_BASE_URL=http://10.0.2.2:8000

  ios-build:
    runs-on: macos-latest
    timeout-minutes: 40
    needs: check
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - run: flutter build ios --simulator --debug
